<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Solo hoy...</title>
<meta name="theme-color" content="#050b1a" />
<meta property="og:title" content="Solo hoy..." />
<meta property="og:description" content="Hay algo esperando por ti." />
<style>
:root{--bg:#050b1a;--pink:#ef6680;--gold:#f3c58b;--ink:#f7e6ce}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
body{min-height:100svh;background:
 radial-gradient(circle at 15% 15%,rgba(245,183,106,.08),transparent 22%),
 radial-gradient(circle at 85% 25%,rgba(239,102,128,.08),transparent 20%),
 linear-gradient(180deg,#030815,#071024 65%,#040914)}
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:.75}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#f7d49a;box-shadow:0 0 8px #f7d49a;animation:tw 2.8s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.65)}}
.app{min-height:100svh;display:grid;place-items:center;padding:18px 14px 26px;position:relative;z-index:2}
.stage{width:min(96vw,820px);display:flex;flex-direction:column;align-items:center;gap:13px}
.card{position:relative;width:100%;border:1px solid rgba(230,151,92,.42);border-radius:20px;overflow:hidden;background:#071020;box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.015) inset;opacity:0;transform:translateY(12px) scale(.985);transition:.55s ease}
.card.show{opacity:1;transform:none}
.card img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.tap-layer{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}
#wake{position:absolute;left:27%;right:26%;bottom:2.2%;height:13%;border:0;background:transparent;cursor:pointer;border-radius:999px}
.hint{font-family:system-ui,-apple-system,Segoe UI,sans-serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5);opacity:0;transition:.4s}
.hint.on{opacity:1}
.controls{display:flex;gap:9px;align-items:center;justify-content:center;min-height:38px}
.control{border:1px solid rgba(239,102,128,.35);background:rgba(239,102,128,.08);color:#ffdbe2;border-radius:999px;padding:8px 13px;font:600 12px system-ui,-apple-system,Segoe UI,sans-serif;cursor:pointer;backdrop-filter:blur(5px)}
.control:hover{background:rgba(239,102,128,.14)}
#replay{display:none}
#musicBtn{display:none}
.confetti{position:fixed;z-index:5;top:-14px;width:9px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(720deg);opacity:.25}}
.fade-cover{position:fixed;inset:0;background:#050b1a;z-index:4;pointer-events:none;opacity:0;transition:opacity .28s}
.fade-cover.on{opacity:1}
@media(max-width:600px){.app{padding:12px 9px 20px}.stage{width:100%}.card{border-radius:15px}.hint{font-size:10px}.control{font-size:11px}}
</style>
</head>
<body>
<div id="stars"></div><div id="fade" class="fade-cover"></div>
<div class="app">
  <main class="stage">
    <section class="card" id="card" aria-live="polite">
      <img id="scene" src="assets/01_dormido.png" alt="Sorpresa de cumpleaños con un gatito" />
      <button id="wake" aria-label="Despertar al gordito"></button>
      <button id="tap" class="tap-layer" aria-label="Continuar" style="display:none"></button>
    </section>
    <div id="hint" class="hint">Toca para continuar ✨</div>
    <div class="controls">
      <button id="musicBtn" class="control">♫ Música</button>
      <button id="replay" class="control">↻ Volver a ver</button>
    </div>
  </main>
</div>
<audio id="music" src="musica.mp3" loop preload="auto"></audio>
<script>
const scenes=[
 'assets/01_dormido.png','assets/02_despertar.png','assets/03_cumple.png',
 'assets/04_mensaje.png','assets/05_personal.png','assets/06_cierre.png'
];
const img=document.getElementById('scene'), card=document.getElementById('card'), wake=document.getElementById('wake'), tap=document.getElementById('tap'), hint=document.getElementById('hint'), fade=document.getElementById('fade'), replay=document.getElementById('replay'), music=document.getElementById('music'), musicBtn=document.getElementById('musicBtn');
let step=0, canTap=false, musicAvailable=true;
function stars(){const box=document.getElementById('stars');for(let i=0;i<55;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*3)+'s';s.style.opacity=.25+Math.random()*.7;box.appendChild(s)}}
stars(); requestAnimationFrame(()=>card.classList.add('show'));
function swap(n,auto=false){
  canTap=false; hint.classList.remove('on'); fade.classList.add('on');
  setTimeout(()=>{step=n; img.src=scenes[n]; wake.style.display=n===0?'block':'none'; tap.style.display=n===0?'none':'block'; fade.classList.remove('on');
    if(n===2){burst(); setTimeout(()=>{canTap=true;hint.classList.add('on')},2100)}
    else if(n>2 && n<5){setTimeout(()=>{canTap=true;hint.classList.add('on')},850)}
    else if(n===5){tap.style.display='none'; replay.style.display='inline-block'; hint.classList.remove('on')}
  },280);
}
function burst(){for(let i=0;i<85;i++){const c=document.createElement('span');c.className='confetti';c.style.left=(Math.random()*100)+'vw';c.style.background=['#ef6680','#f3c58b','#fff0d0','#d966e9','#7bc6e8'][Math.floor(Math.random()*5)];c.style.setProperty('--dx',(Math.random()*180-90)+'px');c.style.animationDuration=(2.8+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),5600)}}
function tryMusic(){music.play().then(()=>{musicBtn.style.display='inline-block';musicBtn.textContent='♫ Música: sí'}).catch(()=>{musicAvailable=false})}
wake.addEventListener('click',e=>{e.stopPropagation();tryMusic();swap(1);setTimeout(()=>swap(2),1550)});
tap.addEventListener('click',()=>{if(!canTap)return;if(step===2)swap(3);else if(step===3)swap(4);else if(step===4)swap(5)});
replay.addEventListener('click',()=>{replay.style.display='none';canTap=false;swap(0)});
musicBtn.addEventListener('click',()=>{if(music.paused){music.play();musicBtn.textContent='♫ Música: sí'}else{music.pause();musicBtn.textContent='♫ Música: no'}});
music.addEventListener('error',()=>{musicBtn.style.display='none'});
</script>
</body>
</html>
